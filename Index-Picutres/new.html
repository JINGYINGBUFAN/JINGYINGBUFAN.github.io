<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flex Grow Animation</title>
  <style>
    .container {
      display: flex;
      width: 100%;
      height: 200px;
      background-color: #f0f0f0;
    }
    .item {
      flex: 1;
      background-color: #4CAF50;
      margin: 0.1%;
      transition: flex-grow 0.3s ease;
    }
    .item:hover {
      flex-grow: 1.2;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
  </div>
</body>
</html>
