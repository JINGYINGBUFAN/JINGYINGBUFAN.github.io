<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll Down Button</title>
  <style>
    /* General styling for the page */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* Full-screen section */
    .section {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      box-sizing: border-box;
    }

    .section-1 {
      background-color: #f0f0f0;
    }

    .section-2 {
      background-color: #d0f0ff;
    }

    /* Scroll button styling */
    .scroll-down-btn {
      align-self: center; /* Center horizontally */
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .scroll-down-btn:hover {
      background-color: #0056b3;
    }

    /* Smooth scrolling */
    html {
      scroll-behavior: smooth;
    }
  </style>
</head>
<body>
  <!-- Section 1 -->
  <div class="section section-1">
    <div>
      <h1>Welcome to Section 1</h1>
      <p>This is some content at the top of Section 1.</p>
    </div>
    <!-- Scroll Down Button -->
    <a href="#section-2" class="scroll-down-btn">Scroll Down</a>
  </div>

  <!-- Section 2 -->
  <div id="section-2" class="section section-2">
    <h1>Welcome to Section 2</h1>
  </div>
</body>
</html>
